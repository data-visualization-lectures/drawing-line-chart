<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クイズ — 描いて答える折れ線グラフ</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WXY3CQ3RNF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  if (new URLSearchParams(location.search).get('embed') !== '1') {
    gtag('config', 'G-WXY3CQ3RNF');
  }
</script>
<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- D3.js -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="d3.sketchy.js"></script>
<script src="safe-dom.js"></script>
<link rel="stylesheet" href="ydi-page.css">
<link rel="stylesheet" href="ydi-chart.css">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap" rel="stylesheet">
</head>
<body>

<div class="dvz-app">
  <div id="dvz-loading"></div>
  <div id="dvz-error" style="display:none"></div>
  <p class="dvz-lead" id="dvz-lead" style="display:none"></p>
  <div id="dvz-content" style="display:none"></div>
  <div class="dvz-cta" id="dvz-cta" style="display:none">
    <a href="https://www.dataviz.jp/drawing-line-chart/" target="_blank" rel="noopener" id="dvz-cta-link"></a>
  </div>
  <div class="dvz-site-links">
    <a href="https://www.dataviz.jp/drawing-line-chart/" target="_blank" rel="noopener"></a>
    <span>|</span>
    <a href="https://www.dataviz.jp/" target="_blank" rel="noopener">dataviz.jp</a>
  </div>
</div>

<script type="module">
import { ChartInstance } from "./ydi-chart.js";
import { downloadChartPng, renderResultOgPng } from "./ydi-export.js";
import { createQuizClient, resultPageUrl, resultOgPath, uploadOgPng } from "./ydi-config.js";
import {
  createI18n, setupEmbedMode, fillSiteLinks, showLoading, hideLoading, showPageError, startLoadTimeout,
} from "./ydi-public.js";

// ============================================================
//  Quiz Page — 描いて答える折れ線グラフ
// ============================================================

const { t } = createI18n({
  ja: {
    loading: '読み込み中...',
    noId: 'クイズIDが指定されていません',
    notFound: 'クイズが見つかりませんでした',
    error: 'エラーが発生しました',
    timeout: '読み込みがタイムアウトしました。ページを再読み込みしてください。',
    lead: 'タップで線を描いてください',
    titleSuffix: '描いて答える折れ線グラフ',
    toolName: '描いて答える折れ線グラフ',
    buttonText: '答え合わせ',
    drawPrompt: ['線を描いて', '予想してみよう'],
    legendPrediction: 'あなたの予想',
    legendActual: '実際のデータ',
    scoreGood: 'ほぼ正解！',
    scoreOk: '惜しい！',
    scoreLow: '控えめな予想でした',
    scoreHigh: '攻めた予想でした',
    scoreOff: 'ずれていますね',
    shareTitle: '結果をシェアしよう',
    copyUrl: 'URLをコピー',
    copied: 'コピー済み',
    saveImage: '画像を保存',
    cta: '自分のデータで作ってみる',
  },
  en: {
    loading: 'Loading...',
    noId: 'No quiz ID provided',
    notFound: 'Quiz not found',
    error: 'An error occurred',
    timeout: 'Loading timed out. Please reload the page.',
    lead: 'Draw a line to make your prediction',
    titleSuffix: 'Draw & Predict Line Chart',
    toolName: 'Draw & Predict Line Chart',
    buttonText: 'Check Answer',
    drawPrompt: ['Draw a line', 'to predict'],
    legendPrediction: 'Your prediction',
    legendActual: 'Actual data',
    scoreGood: 'Almost correct!',
    scoreOk: 'So close!',
    scoreLow: 'Conservative prediction',
    scoreHigh: 'Bold prediction',
    scoreOff: 'A bit off',
    shareTitle: 'Share your results',
    copyUrl: 'Copy URL',
    copied: 'Copied!',
    saveImage: 'Save image',
    cta: 'Create with your own data',
  }
});

setupEmbedMode();
showLoading(t('loading'));
fillSiteLinks(t('toolName'));
document.getElementById('dvz-lead').textContent = t('lead');
document.getElementById('dvz-cta-link').textContent = t('cta');

const { appendSanitizedHtml } = window.dvzDom;
const quizSupabase = createQuizClient();

function createButton(label) {
  const button = document.createElement('button');
  button.className = 'ydi-share-btn';
  button.textContent = label;
  return button;
}

// 答え合わせ後: 結果URLのコピーと画像保存
function appendShareArea(afterEl, shareUrl, getSvg, title) {
  const shareArea = document.createElement('div');
  shareArea.className = 'dvz-share-area';

  const heading = document.createElement('p');
  heading.className = 'dvz-share-title';
  heading.textContent = t('shareTitle');

  const copyBtn = createButton(t('copyUrl'));
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(shareUrl).then(() => {
      copyBtn.textContent = t('copied');
      setTimeout(() => { copyBtn.textContent = t('copyUrl'); }, 2000);
    });
  });

  const downloadBtn = createButton(t('saveImage'));
  downloadBtn.addEventListener('click', () => downloadChartPng(getSvg(), title));

  const buttons = document.createElement('div');
  buttons.className = 'dvz-share-buttons';
  buttons.append(copyBtn, downloadBtn);

  shareArea.append(heading, buttons);
  afterEl.appendChild(shareArea);
}

async function saveResponse(quizId, { exportData, totalError, avgRatio, label }) {
  const { data, error } = await quizSupabase
    .from("quiz_responses")
    .insert({
      quiz_id: quizId,
      prediction_data: exportData,
      score_label: label,
      total_error: totalError,
      avg_ratio: avgRatio,
    })
    .select("id")
    .single();
  if (error) throw error;
  return data.id;
}

// --------------- 初期化 ---------------
async function init() {
  const containerEl = document.getElementById("dvz-content");
  const quizId = new URLSearchParams(window.location.search).get("id");
  if (!quizId) {
    showPageError(t('noId'));
    return;
  }

  const cancelTimeout = startLoadTimeout(t('timeout'));
  try {
    const { data: quiz, error } = await quizSupabase
      .from("quiz_quizzes")
      .select("*")
      .eq("id", quizId)
      .single();
    cancelTimeout();

    if (error || !quiz) {
      showPageError(t('notFound'));
      return;
    }

    hideLoading();
    containerEl.style.display = "block";
    document.getElementById("dvz-lead").style.display = "block";
    document.title = quiz.title + " — " + t('titleSuffix');

    // 操作文言は閲覧者の言語で出す（保存済み chart_config の文言より優先）
    const cfg = {
      ...quiz.chart_config,
      id: quizId,
      title: quiz.chart_config?.title || quiz.title,
      buttonText: t('buttonText'),
      drawPrompt: t('drawPrompt'),
    };

    new ChartInstance(containerEl, cfg, {
      mode: "interactive",
      controls: "outside",
      breakpoints: "public",
      sanitizeHtml: appendSanitizedHtml,
      labels: {
        legendPrediction: t('legendPrediction'),
        legendActual: t('legendActual'),
        scoreGood: t('scoreGood'),
        scoreOk: t('scoreOk'),
        scoreLow: t('scoreLow'),
        scoreHigh: t('scoreHigh'),
        scoreOff: t('scoreOff'),
      },
    });

    containerEl.addEventListener("you-draw-it:revealed", async (e) => {
      document.getElementById('dvz-cta').style.display = '';

      try {
        const responseId = await saveResponse(quizId, e.detail);
        const getSvg = () => containerEl.querySelector("svg");
        appendShareArea(containerEl.querySelector(".ydi-after-reveal"), resultPageUrl(responseId), getSvg, quiz.title);

        // OG画像（失敗しても結果ページは有効）
        try {
          const pngBlob = await renderResultOgPng(getSvg(), quiz.title, e.detail.label);
          await uploadOgPng(quizSupabase, resultOgPath(responseId), pngBlob);
        } catch (ogErr) {
          console.warn("OG image generation/upload failed:", ogErr);
        }
      } catch (saveErr) {
        console.error("Response save failed:", saveErr);
      }
    });
  } catch (e) {
    cancelTimeout();
    showPageError(t('error'));
    console.error(e);
  }
}

init();
</script>
</body>
</html>
