<html lang="ja">
<head>
<meta charset="UTF-8">

<style>
.you-draw-it {
  max-width: 1200px;
  margin: 0 auto;
  padding: 124px 16px 20px;
}

.you-draw-it h1 {
  font-size: 1.6rem;
  font-weight: 700;
  margin-bottom: 8px;
  text-align: center;
}

.you-draw-it .intro {
  text-align: center;
  color: #666;
  margin-bottom: 32px;
  font-size: 0.95rem;
}

/* Annotation form */
.ydi-annotation-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 12px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px dashed #eee;
}
.ydi-annotation-row .ann-label-wrap {
  grid-column: 1 / -1;
  display: flex;
  gap: 8px;
  align-items: end;
  flex-wrap: wrap;
}
.ydi-annotation-row .ann-label-wrap label { flex: 0 0 100%; font-size: 0.85rem; font-weight: 600; color: #555; }
.ydi-annotation-row .ann-label-wrap input { flex: 1; min-width: 0; }
.ydi-annotation-row .ann-remove {
  flex: none;
  background: none; border: 1px solid #ddd; border-radius: 4px;
  font-size: 0.95rem; cursor: pointer; color: #999;
  padding: 8px 10px;
}
.ydi-annotation-row .ann-remove:hover { color: #c00; border-color: #c00; }
#add-annotation {
  background: none; border: 1px dashed #ccc; border-radius: 4px;
  padding: 6px 14px; font-size: 0.85rem; color: #888; cursor: pointer;
  margin-top: 4px;
}
#add-annotation:hover { border-color: #999; color: #555; }

/* --- Quiz creation form --- */
.ydi-create {
  margin-bottom: 32px;
  padding: 20px;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border: 1px solid #eee;
  border-radius: 8px;
}
.ydi-create h2 {
  font-size: 1.1rem;
  font-weight: 700;
  margin-top: 0;
  margin-bottom: 0;
}
.ydi-create label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: #555;
  margin-bottom: 4px;
}
.ydi-create input[type="text"],
.ydi-create select {
  width: 100%;
  padding: 8px 12px;
  font-size: 0.95rem;
  border: 1px solid #ccc;
  border-radius: 4px;
  margin-bottom: 14px;
}
.ydi-create input:focus,
.ydi-create select:focus {
  outline: none;
  border-color: #333;
}
.ydi-data-source {
  font-size: 0.75rem;
  color: #aaa;
  margin: 4px 0 8px;
}
.ydi-data-source a {
  color: #aaa;
  text-decoration: underline;
}
.ydi-data-source a:hover {
  color: #666;
}
.ydi-create .ydi-field-row {
  display: flex;
  gap: 12px;
}
.ydi-create .ydi-field-row > div {
  flex: 1;
}

/* Drop zone */
.ydi-dropzone {
  border: 2px dashed #ccc;
  border-radius: 8px;
  padding: 24px 16px;
  text-align: center;
  color: #999;
  font-size: 0.9rem;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  margin-bottom: 14px;
}
.ydi-dropzone:hover,
.ydi-dropzone.dragover {
  border-color: #666;
  background: #f0f0f0;
}
.ydi-dropzone.loaded {
  border-color: #4caf50;
  background: #e8f5e9;
  color: #2e7d32;
}
.ydi-dropzone input[type="file"] {
  display: none;
}
.ydi-data-preview {
  max-height: 150px;
  overflow-y: auto;
  font-size: 0.8rem;
  margin-bottom: 14px;
  border: 1px solid #eee;
  border-radius: 4px;
}
.ydi-data-preview table {
  width: 100%;
  border-collapse: collapse;
}
.ydi-data-preview th,
.ydi-data-preview td {
  padding: 4px 8px;
  text-align: right;
  border-bottom: 1px solid #f0f0f0;
}
.ydi-data-preview th {
  background: #f8f8f8;
  font-weight: 600;
  position: sticky;
  top: 0;
}
.ydi-preview-section {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid #eee;
}
.ydi-preview-section h3 {
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 8px;
  color: #666;
}

/* --- Two-column layout --- */
.ydi-two-column {
  display: flex;
  gap: 24px;
  align-items: flex-start;
}
.ydi-left-panel {
  flex: 0 0 420px;
  min-width: 0;
}
.ydi-right-panel {
  flex: 1 1 0;
  min-width: 0;
}
.ydi-preview-sticky {
  position: -webkit-sticky;
  position: sticky;
  top: 80px;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border: 1px solid #eee;
  border-radius: 8px;
  padding: 20px;
}
.ydi-preview-sticky .ydi-chart-wrap {
  margin-bottom: 0;
  box-shadow: none;
}

/* --- Accordion --- */
.ydi-accordion-step {
  border-bottom: 1px solid #eee;
}
.ydi-accordion-step:last-child {
  border-bottom: none;
}
.ydi-step-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  padding: 14px 0;
  user-select: none;
}
.ydi-step-header h2 {
  margin: 0;
  pointer-events: none;
}
.ydi-step-header .ydi-chevron {
  transition: transform 0.3s;
  font-size: 0.75rem;
  color: #999;
}
.ydi-accordion-step.open .ydi-chevron {
  transform: rotate(180deg);
}
.ydi-step-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}
.ydi-accordion-step.open .ydi-step-body {
  max-height: 2000px;
  padding-bottom: 8px;
}

/* --- Preview placeholder --- */
.ydi-preview-placeholder {
  border: 2px dashed #ccc;
  border-radius: 8px;
  padding: 60px 20px;
  text-align: center;
  color: #999;
  font-size: 0.9rem;
  background: #fafafa;
}

/* --- Responsive --- */
@media (max-width: 900px) {
  .ydi-two-column { flex-direction: column; }
  .ydi-left-panel { flex: none; width: 100%; }
  .ydi-right-panel { flex: none; width: 100%; }
  .ydi-preview-sticky { position: static; }
}
@media (max-width: 600px) {
  .you-draw-it { padding: 108px 8px 12px; }
  .you-draw-it h1 { font-size: 1.3rem; }
}
</style>
</head>
<body>

<dataviz-tool-header></dataviz-tool-header>

<div class="you-draw-it" id="app">
  <h1>描いて答える折れ線グラフ</h1>
  <p class="intro">データをアップロードして、クイズを作成しよう。</p>

  <div class="ydi-two-column">
    <!-- 左パネル: 設定フォーム -->
    <div class="ydi-left-panel">
      <div class="ydi-create" id="create-form">

        <!-- Step 1: データアップロード -->
        <div class="ydi-accordion-step open" data-step="1">
          <div class="ydi-step-header">
            <h2>1. データをアップロード</h2>
            <span class="ydi-chevron">&#9660;</span>
          </div>
          <div class="ydi-step-body">
            <p class="ydi-data-source" id="data-source"></p>
            <div class="ydi-dropzone" id="dropzone">
              <p>CSVファイルをドラッグ＆ドロップ、またはクリックして選択</p>
              <input type="file" id="file-input" accept=".csv,.json">
            </div>
            <div class="ydi-field-row" id="col-select-row" style="display:none; margin-top: 12px">
              <div>
                <label for="col-x">X軸（時系列）</label>
                <select id="col-x"></select>
              </div>
              <div>
                <label for="col-y">Y軸（数値）</label>
                <select id="col-y"></select>
              </div>
            </div>
            <div class="ydi-field-row" id="data-preview" style="display:none">
              <div class="ydi-data-preview" id="data-preview-x"></div>
              <div class="ydi-data-preview" id="data-preview-y"></div>
            </div>
          </div>
        </div>

        <!-- Step 2: 対象期間 -->
        <div class="ydi-accordion-step" data-step="2">
          <div class="ydi-step-header">
            <h2>2. 対象期間</h2>
            <span class="ydi-chevron">&#9660;</span>
          </div>
          <div class="ydi-step-body">
            <div class="ydi-field-row" id="period-select-row" style="display:none">
              <div>
                <label for="period-start">開始</label>
                <select id="period-start" disabled>
                  <option value="">データを先にアップロード</option>
                </select>
              </div>
              <div>
                <label for="period-end">終了</label>
                <select id="period-end" disabled>
                  <option value="">データを先にアップロード</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Step 3: クイズの設定 -->
        <div class="ydi-accordion-step" data-step="3">
          <div class="ydi-step-header">
            <h2>3. クイズの設定</h2>
            <span class="ydi-chevron">&#9660;</span>
          </div>
          <div class="ydi-step-body">
            <label for="quiz-title">タイトル（質問文）</label>
            <input type="text" id="quiz-title" placeholder="例: 日本の人口はどう推移した？">

            <div class="ydi-field-row">
              <div>
                <label for="quiz-draw-start">ここから予想（出題範囲の開始）</label>
                <select id="quiz-draw-start" disabled>
                  <option value="">データを先にアップロード</option>
                </select>
              </div>
              <div>
                <label for="quiz-unit">単位（任意）</label>
                <input type="text" id="quiz-unit" placeholder="例: %, 万人, $">
              </div>
            </div>

            <div class="ydi-field-row">
              <div>
                <label for="quiz-style">スタイル</label>
                <select id="quiz-style">
                  <option value="">標準</option>
                  <option value="sketchy">手書き風</option>
                </select>
              </div>
              <div></div>
            </div>
          </div>
        </div>

        <!-- Step 4: アノテーション -->
        <div class="ydi-accordion-step" data-step="4">
          <div class="ydi-step-header">
            <h2>4. 期間アノテーション（任意）</h2>
            <span class="ydi-chevron">&#9660;</span>
          </div>
          <div class="ydi-step-body">
            <div class="ydi-field-row" style="margin-bottom:8px">
              <div>
                <label for="ann-granularity">期間の粒度</label>
                <select id="ann-granularity">
                  <option value="year">年</option>
                  <option value="yyyymm">年月</option>
                </select>
              </div>
              <div></div>
            </div>
            <div id="annotations-list"></div>
            <button type="button" id="add-annotation">+ 期間を追加</button>
          </div>
        </div>

      </div>
    </div>

    <!-- 右パネル: プレビュー -->
    <div class="ydi-right-panel">
      <div class="ydi-preview-sticky">
        <div class="ydi-preview-placeholder" id="preview-placeholder">
          <p>データをアップロードすると<br>プレビューが表示されます</p>
        </div>
        <div class="ydi-preview-section" id="preview-section" style="display:none">
          <div id="preview-container"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { ChartInstance } from "./ydi-chart.js";
import { generateThumbnailDataUri, renderQuizOgPng } from "./ydi-export.js";
import {
  SUPABASE_URL, TOOL_NAME_JA, createQuizClient, quizPageUrl, quizOgPath, uploadOgPng,
} from "./ydi-config.js";
import {
  loadDateParser, isTimeSeriesCol, isNumericCol, detectXFormat, formatXValue, rowsToSeries, validateSeries,
  annotationOptions,
} from "./ydi-data.js";

// ============================================================
//  描いて答える折れ線グラフ — 作成エディタ
// ============================================================

const APP_NAME = "drawing-line-chart";
const NO_DATA_MESSAGE = "データをアップロードして設定を完了してください";

const { appendSanitizedHtml, createSingleColumnTable, populateSelect } = window.dvzDom;
const quizSupabase = createQuizClient();
const dateParserReady = loadDateParser();

// --------------- 状態 ---------------
let uploadedData = null;     // [{x, y}, ...]
let csvRawRows = null;       // CSVの生データ（列選択変更用）。JSON読込・プロジェクト復元時は null
let currentXFormat = "year"; // "year" or "yyyymm"
let currentConfigs = [];
let currentProjectId = null;
let currentProjectName = null;
let previewChart = null;
let previewDebounce = null;

// --------------- DOM ---------------
const byId = (id) => document.getElementById(id);
const dropzone = byId("dropzone");
const fileInput = byId("file-input");
const dataSource = byId("data-source");
const colSelectRow = byId("col-select-row");
const colXSelect = byId("col-x");
const colYSelect = byId("col-y");
const dataPreview = byId("data-preview");
const periodRow = byId("period-select-row");
const periodStartSelect = byId("period-start");
const periodEndSelect = byId("period-end");
const drawStartSelect = byId("quiz-draw-start");
const titleInput = byId("quiz-title");
const unitInput = byId("quiz-unit");
const styleSelect = byId("quiz-style");
const annGranularity = byId("ann-granularity");
const annotationsList = byId("annotations-list");
const previewPlaceholder = byId("preview-placeholder");
const previewSection = byId("preview-section");
const previewContainer = byId("preview-container");

const previewSvg = () => previewContainer.querySelector(".ydi-chart-wrap svg");

// --------------- 認証 / ツールヘッダー ---------------
function waitFor(getValue, timeoutMs, intervalMs) {
  const value = getValue();
  if (value) return Promise.resolve(value);
  return new Promise((resolve) => {
    const startedAt = Date.now();
    const timer = setInterval(() => {
      const current = getValue();
      if (current || Date.now() - startedAt >= timeoutMs) {
        clearInterval(timer);
        resolve(current || null);
      }
    }, intervalMs);
  });
}

async function getAccessToken() {
  const client = await waitFor(() => window.datavizSupabase, 5000, 200);
  if (!client) return null;
  const { data: { session } } = await client.auth.getSession();
  return session?.access_token || null;
}

function getReadyToolHeader() {
  const header = document.querySelector("dataviz-tool-header");
  return header && typeof header.setConfig === "function" ? header : null;
}

async function waitForToolHeaderReady() {
  if (!getReadyToolHeader() && window.customElements?.whenDefined) {
    try {
      await window.customElements.whenDefined("dataviz-tool-header");
    } catch (_error) {}
  }
  return waitFor(getReadyToolHeader, 5000, 100);
}

function showMessage(msg, type = "info", duration) {
  const header = getReadyToolHeader();
  if (header?.showMessage) {
    header.showMessage(msg, type, duration);
  } else {
    alert(msg);
  }
}

function showProcessingToast(msg) {
  showMessage(msg, "info", 5000);
}

// --------------- プロジェクト保存 / シェア ---------------
function normalizeSavedProjectMeta(meta) {
  const project = meta?.project && typeof meta.project === "object" ? meta.project : null;
  return {
    id: meta?.id || project?.id || null,
    name: meta?.name || project?.name || null,
  };
}

function getCurrentProjectPayload() {
  const cfg = buildConfig();
  const charts = cfg ? [cfg] : currentConfigs;
  if (!Array.isArray(charts) || !charts.length) return null;
  return { charts, version: 1 };
}

async function buildEditorSavePayload() {
  const data = getCurrentProjectPayload();
  if (!data) return null;
  return {
    name: currentProjectName || data.charts[0]?.title || "新しいプロジェクト",
    data,
    thumbnailDataUri: await generateThumbnailDataUri(previewSvg()),
    existingProjectId: currentProjectId,
  };
}

async function openSaveModal(header) {
  if (!getCurrentProjectPayload()) {
    showMessage(NO_DATA_MESSAGE, "error");
    return;
  }
  showProcessingToast("保存準備中です");
  header.showSaveModal(await buildEditorSavePayload());
}

function getCurrentQuizShareTitle() {
  const candidates = [buildConfig()?.title, currentConfigs[0]?.title, currentProjectName];
  return candidates.map((value) => String(value || "").trim()).find(Boolean) || TOOL_NAME_JA;
}

function escapeHtmlAttr(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function buildQuizIframeEmbedCode(quizId, rawTitle) {
  const resolvedTitle = String(rawTitle || "").trim();
  const title = escapeHtmlAttr(resolvedTitle ? `${resolvedTitle} - ${TOOL_NAME_JA}` : TOOL_NAME_JA);
  const src = `${quizPageUrl(quizId)}&embed=1`;
  return `<iframe title="${title}" src="${src}" frameborder="0" scrolling="auto" allow="fullscreen; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" loading="lazy" allowfullscreen="true" style="display:block;width:100%;max-width:100%;min-height:600px;border:0;margin:0 auto;padding:0;"></iframe>`;
}

function getApiErrorMessage(payload, fallback) {
  if (typeof payload?.error === "string") return payload.error;
  if (typeof payload?.error?.message === "string") return payload.error.message;
  if (typeof payload?.message === "string") return payload.message;
  return fallback;
}

// 保存済みプロジェクトを Edge Function に渡し、quiz_quizzes を source_project_id 単位で upsert する
async function publishQuizFromProject({ projectId, fallbackTitle }) {
  if (!projectId) {
    throw new Error("シェアする前にプロジェクトを保存してください");
  }

  const accessToken = await getAccessToken();
  if (!accessToken) {
    throw new Error("Login required");
  }

  const response = await fetch(`${SUPABASE_URL}/functions/v1/publish-drawing-line-chart-quiz`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Dataviz-Authorization": `Bearer ${accessToken}`,
    },
    body: JSON.stringify({ projectId, fallbackTitle: fallbackTitle || null }),
  });

  const payload = await response.json().catch(() => null);
  if (!response.ok) {
    throw new Error(getApiErrorMessage(payload, `Share publish failed (${response.status})`));
  }
  return payload || {};
}

async function publishQuizShare({ projectId, title }) {
  showProcessingToast("シェアを作成中です");
  const result = await publishQuizFromProject({
    projectId: String(projectId || "").trim(),
    fallbackTitle: String(title || "").trim(),
  });
  const quizId = result?.quizId || result?.id || null;
  if (!quizId) {
    throw new Error("No quiz ID returned");
  }

  return {
    shareId: quizId,
    shareUrl: quizPageUrl(quizId),
    iframeCode: buildQuizIframeEmbedCode(quizId, title || result?.title || getCurrentQuizShareTitle()),
  };
}

// OG画像（失敗してもシェアは成功のまま）
async function publishQuizOgImage({ shareId, title }) {
  try {
    const pngBlob = await renderQuizOgPng(previewSvg(), title || getCurrentQuizShareTitle());
    return !!(await uploadOgPng(quizSupabase, quizOgPath(shareId), pngBlob));
  } catch (error) {
    console.warn("Quiz OGP publish failed:", error);
    return false;
  }
}

async function setupToolHeader() {
  const toolHeader = await waitForToolHeaderReady();
  if (!toolHeader) return;
  if (toolHeader.__dvzDrawingLineChartHeaderConfigured === "1") return;
  toolHeader.__dvzDrawingLineChartHeaderConfigured = "1";

  // 公開ボタンはヘッダーの「シェア」（PUBLISH_FLOW_SPEC）
  toolHeader.setConfig({
    logo: { type: "text", text: TOOL_NAME_JA },
    buttons: [
      { label: "プロジェクトの読込", action: () => toolHeader.showLoadModal(), id: "load-btn", align: "right" },
      { label: "プロジェクトの保存", action: () => openSaveModal(toolHeader), id: "save-btn", align: "right" },
      { label: "シェア", action: () => toolHeader.shareProject?.(), id: "share-btn", align: "right" },
    ],
  });

  toolHeader.setProjectConfig({
    appName: APP_NAME,
    onProjectLoad: (projectData, meta) => {
      if (Array.isArray(projectData.charts)) {
        restoreFormFromConfig(projectData.charts[0]);
      }
      currentProjectId = meta?.isGroupProject ? null : (meta?.projectId || currentProjectId);
      if (!meta?.isGroupProject && meta?.name) {
        currentProjectName = meta.name;
      }
    },
    onProjectSave: (meta) => {
      const normalized = normalizeSavedProjectMeta(meta);
      currentProjectId = normalized.id;
      currentProjectName = normalized.name;
    },
    onProjectDelete: (deletedId) => {
      if (deletedId && currentProjectId === deletedId) {
        currentProjectId = null;
        currentProjectName = null;
      }
    },
  });

  toolHeader.setShareConfig?.({
    getSavePayload: () => buildEditorSavePayload(),
    getShareTitle: () => getCurrentQuizShareTitle(),
    publishShare: (args) => publishQuizShare(args),
    afterPublish: (args) => publishQuizOgImage(args),
  });

  toolHeader.setSampleConfig({
    toolId: APP_NAME,
    onSampleSelect: async (detail) => {
      const res = await fetch(detail.url);
      loadDataText(await res.text(), (detail.name || "sample") + ".csv");
    },
  });
}

// --------------- ?data_url / ?projectId 自動読込 ---------------
async function autoLoadFromURL() {
  const params = new URLSearchParams(window.location.search);

  const dataUrl = params.get("data_url");
  if (dataUrl) {
    try {
      const res = await fetch(dataUrl);
      loadDataText(await res.text(), dataUrl.split("/").pop() || "data.csv");
    } catch (err) {
      console.error("data_url load failed:", err);
    }
    // data_url だけ消す（auth_debug などは残す）
    params.delete("data_url");
    const query = params.toString();
    window.history.replaceState({}, document.title, window.location.pathname + (query ? `?${query}` : ""));
    return;
  }

  const projectId = params.get("projectId");
  if (!projectId || !(await getAccessToken())) return;

  try {
    await headerSetup;
    const header = getReadyToolHeader();
    if (typeof header?.loadProject !== "function") return;
    const data = await header.loadProject(projectId);
    if (Array.isArray(data?.charts)) {
      restoreFormFromConfig(data.charts[0]);
      currentProjectId = projectId;
    }
  } catch (e) {
    console.error("Auto-load failed:", e);
  }
}

// --------------- フォーム復元（読込時） ---------------
function restoreFormFromConfig(cfg) {
  if (!cfg || !cfg.data) return;
  uploadedData = cfg.data;
  csvRawRows = null;
  colSelectRow.style.display = "none";
  currentXFormat = cfg.xFormat || "year";
  onDataLoaded();

  titleInput.value = cfg.title || "";
  unitInput.value = cfg.unit || "";
  styleSelect.value = cfg.style || "";
  annotationsList.replaceChildren();
  (cfg.annotations || []).forEach((ann) => addAnnotationRow(ann.startX, ann.endX, ann.label));
  if (cfg.drawStartX) {
    drawStartSelect.value = cfg.drawStartX;
  }

  renderPreview(cfg);
  [1, 2, 3, 4].forEach((n) => setStepOpen(n, true));
}

// --------------- データ読込 ---------------
dropzone.addEventListener("click", () => fileInput.click());
dropzone.addEventListener("dragover", (e) => { e.preventDefault(); dropzone.classList.add("dragover"); });
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
dropzone.addEventListener("drop", (e) => {
  e.preventDefault();
  dropzone.classList.remove("dragover");
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});
fileInput.addEventListener("change", (e) => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

async function handleFile(file) {
  loadDataText(await file.text(), file.name);
}

const toOption = (col) => ({ value: col, label: col });

// 選択中の列で CSV を系列に変換して読み込む
function loadCsvColumns(xCol, yCol) {
  const series = validateSeries(rowsToSeries(csvRawRows, xCol, yCol));
  currentXFormat = detectXFormat(csvRawRows, xCol);
  uploadedData = series;
  onDataLoaded();
}

async function loadDataText(text, fileName) {
  dataSource.replaceChildren();
  showProcessingToast("ファイルを読み込み中です");
  await dateParserReady;
  try {
    if (fileName.endsWith(".json")) {
      const rows = JSON.parse(text);
      if (!Array.isArray(rows)) throw new Error("JSONは配列形式にしてください");
      const series = validateSeries(rows);
      csvRawRows = null;
      colSelectRow.style.display = "none";
      uploadedData = series;
      onDataLoaded();
      return;
    }

    const rows = d3.csvParse(text);
    const cols = Object.keys(rows[0] || {});
    if (cols.length < 2) throw new Error("2列以上のCSVが必要です");

    // 時系列列と数値列を自動検出（Y軸の候補は数値列のみ）
    const autoX = cols.find(c => isTimeSeriesCol(rows, c));
    const autoY = cols.find(c => c !== autoX && isNumericCol(rows, c));
    if (!autoX || !autoY) throw new Error("時系列列と数値列が見つかりません");

    csvRawRows = rows;
    populateSelect(colXSelect, cols.map(toOption), autoX);
    populateSelect(colYSelect, cols.filter(c => isNumericCol(rows, c)).map(toOption), autoY);
    colSelectRow.style.display = "";
    loadCsvColumns(autoX, autoY);
  } catch (err) {
    showMessage("データの読み込みに失敗: " + err.message, "error");
  }
}

function onColumnChange() {
  if (!csvRawRows) return;
  try {
    loadCsvColumns(colXSelect.value, colYSelect.value);
  } catch (err) {
    showMessage(err.message, "error");
  }
}
colXSelect.addEventListener("change", onColumnChange);
colYSelect.addEventListener("change", onColumnChange);

function renderDataPreview() {
  const colXLabel = csvRawRows ? colXSelect.value : "x";
  const colYLabel = csvRawRows ? colYSelect.value : "y";
  const valuesX = csvRawRows ? csvRawRows.map(row => row[colXLabel] || "") : uploadedData.map(d => d.x);
  const valuesY = csvRawRows ? csvRawRows.map(row => row[colYLabel] || "") : uploadedData.map(d => d.y);
  byId("data-preview-x").replaceChildren(createSingleColumnTable(colXLabel, valuesX));
  byId("data-preview-y").replaceChildren(createSingleColumnTable(colYLabel, valuesY));
  dataPreview.style.display = "";
}

const xOption = (x) => ({ value: x, label: formatXValue(x, currentXFormat) });

function onDataLoaded() {
  // アノテーション粒度をデータに合わせる
  annGranularity.value = currentXFormat === "yyyymm" ? "yyyymm" : "year";

  dropzone.classList.add("loaded");
  dropzone.querySelector("p").textContent = `${uploadedData.length}件のデータを読み込みました`;
  renderDataPreview();

  const periodOptions = uploadedData.map(d => xOption(d.x));
  populateSelect(periodStartSelect, periodOptions, uploadedData[0].x);
  populateSelect(periodEndSelect, periodOptions, uploadedData[uploadedData.length - 1].x);
  periodStartSelect.disabled = false;
  periodEndSelect.disabled = false;
  periodRow.style.display = "";

  populateDrawStart();
  updatePreview();

  setStepOpen(1, false);
  setStepOpen(2, true);
  setStepOpen(3, true);
}

// 対象期間で絞った系列
function getFilteredData() {
  if (!uploadedData) return null;
  const startVal = parseFloat(periodStartSelect.value);
  const endVal = parseFloat(periodEndSelect.value);
  if (isNaN(startVal) || isNaN(endVal)) return uploadedData;
  return uploadedData.filter(d => d.x >= startVal && d.x <= endVal);
}

// 予想開始の選択肢（両端を除く。既定は中央）
function populateDrawStart() {
  const filtered = getFilteredData();
  if (!filtered || filtered.length < 2) return;
  const midX = filtered[Math.floor(filtered.length / 2)].x;
  populateSelect(drawStartSelect, filtered.slice(1, -1).map(d => xOption(d.x)), midX);
  drawStartSelect.disabled = false;
}

function onPeriodChange() {
  populateDrawStart();
  updatePreview();
}
periodStartSelect.addEventListener("change", onPeriodChange);
periodEndSelect.addEventListener("change", onPeriodChange);

// --------------- プレビュー ---------------
function renderPreview(cfg) {
  clearTimeout(previewDebounce);
  previewPlaceholder.style.display = "none";
  previewSection.style.display = "block";
  previewChart?.destroy();
  previewContainer.replaceChildren();
  currentConfigs = [cfg];
  previewChart = new ChartInstance(previewContainer, cfg, { sanitizeHtml: appendSanitizedHtml });
}

function updatePreview() {
  if (!uploadedData) return;
  clearTimeout(previewDebounce);
  previewDebounce = setTimeout(() => {
    const cfg = buildConfig();
    if (cfg) renderPreview(cfg);
  }, 200);
}

function readAnnotations() {
  return [...annotationsList.querySelectorAll(".ydi-annotation-row")]
    .map(row => ({
      startX: parseFloat(row.querySelector(".ann-start").value),
      endX: parseFloat(row.querySelector(".ann-end").value),
      label: row.querySelector(".ann-label").value.trim(),
    }))
    .filter(ann => !isNaN(ann.startX) && !isNaN(ann.endX));
}

function buildConfig() {
  const filtered = getFilteredData();
  if (!filtered || filtered.length < 3) return null;
  const drawStartX = parseFloat(drawStartSelect.value);
  if (isNaN(drawStartX)) return null;

  const annotations = readAnnotations();
  return {
    id: "preview",
    title: titleInput.value || "タイトル未設定",
    data: filtered,
    drawStartX,
    unit: unitInput.value || "",
    style: styleSelect.value || undefined,
    xFormat: currentXFormat !== "year" ? currentXFormat : undefined,
    annotations: annotations.length > 0 ? annotations : undefined,
    yFormat: ",.0f",
    precision: 0,
    yExtent: 1.5,
  };
}

drawStartSelect.addEventListener("change", updatePreview);
titleInput.addEventListener("input", updatePreview);
unitInput.addEventListener("input", updatePreview);
styleSelect.addEventListener("change", updatePreview);

// --------------- アノテーション ---------------
function populateAnnotationSelect(selectEl, selectedVal) {
  const options = annotationOptions(getFilteredData(), annGranularity.value);
  populateSelect(selectEl, options);
  const selected = options.find(o => Math.abs(o.value - selectedVal) < 0.001);
  if (selected) selectEl.value = String(selected.value);
  return options.length;
}

function createField(labelText, control, className) {
  const wrap = document.createElement("div");
  if (className) wrap.className = className;
  const label = document.createElement("label");
  label.textContent = labelText;
  wrap.append(label, control);
  return wrap;
}

function createSelect(className) {
  const select = document.createElement("select");
  select.className = className;
  return select;
}

function addAnnotationRow(startX, endX, label) {
  const startSel = createSelect("ann-start");
  const endSel = createSelect("ann-end");
  if (!populateAnnotationSelect(startSel, startX)) return;
  populateAnnotationSelect(endSel, endX);

  const labelInput = document.createElement("input");
  labelInput.type = "text";
  labelInput.className = "ann-label";
  labelInput.placeholder = "例: 高市内閣";
  labelInput.value = label || "";

  const removeBtn = document.createElement("button");
  removeBtn.type = "button";
  removeBtn.className = "ann-remove";
  removeBtn.textContent = "×";

  const labelWrap = createField("ラベル", labelInput, "ann-label-wrap");
  labelWrap.appendChild(removeBtn);

  const row = document.createElement("div");
  row.className = "ydi-annotation-row";
  row.append(createField("開始", startSel), createField("終了", endSel), labelWrap);
  annotationsList.appendChild(row);
  updatePreview();
}

// 粒度変更時: 既存行の選択肢を作り直す（値とラベルは保持）
annGranularity.addEventListener("change", () => {
  annotationsList.querySelectorAll(".ydi-annotation-row").forEach(row => {
    const startSel = row.querySelector(".ann-start");
    const endSel = row.querySelector(".ann-end");
    const startVal = parseFloat(startSel.value);
    const endVal = parseFloat(endSel.value);
    populateAnnotationSelect(startSel, startVal);
    populateAnnotationSelect(endSel, endVal);
  });
  updatePreview();
});
byId("add-annotation").addEventListener("click", () => addAnnotationRow());
annotationsList.addEventListener("change", updatePreview);
annotationsList.addEventListener("input", updatePreview);
annotationsList.addEventListener("click", (e) => {
  if (e.target.classList.contains("ann-remove")) {
    e.target.closest(".ydi-annotation-row").remove();
    updatePreview();
  }
});

// --------------- アコーディオン ---------------
function setStepOpen(n, open) {
  document.querySelector(`.ydi-accordion-step[data-step="${n}"]`)?.classList.toggle("open", open);
}
document.querySelectorAll(".ydi-step-header").forEach(header => {
  header.addEventListener("click", () => {
    header.closest(".ydi-accordion-step").classList.toggle("open");
  });
});

// --------------- 初期化 ---------------
// ?projectId= の読込はヘッダー設定（setProjectConfig）の完了を待つ
const headerSetup = setupToolHeader();
autoLoadFromURL();
</script>
</body>
</html>
