<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color: #333;
  background-color: #eff3ff;
  background-image: url("data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M8 16c4.418 0 8-3.582 8-8s-3.582-8-8-8-8 3.582-8 8 3.582 8 8 8zm0-2c3.314 0 6-2.686 6-6s-2.686-6-6-6-6 2.686-6 6 2.686 6 6 6zm33.414-6l5.95-5.95L45.95.636 40 6.586 34.05.636 32.636 2.05 38.586 8l-5.95 5.95 1.414 1.414L40 9.414l5.95 5.95 1.414-1.414L41.414 8zM40 48c4.418 0 8-3.582 8-8s-3.582-8-8-8-8 3.582-8 8 3.582 8 8 8zm0-2c3.314 0 6-2.686 6-6s-2.686-6-6-6-6 2.686-6 6 2.686 6 6 6zM9.414 40l5.95-5.95-1.414-1.414L8 38.586l-5.95-5.95L.636 34.05 6.586 40l-5.95 5.95 1.414 1.414L8 41.414l5.95 5.95 1.414-1.414L9.414 40z' fill='%23bdd7e7' fill-opacity='0.4' fill-rule='evenodd'/%3E%3C/svg%3E");
  line-height: 1.6;
}

.you-draw-it {
  max-width: 1200px;
  margin: 0 auto;
  padding: 124px 16px 20px;
}

.you-draw-it h1 {
  font-size: 1.6rem;
  font-weight: 700;
  margin-bottom: 8px;
  text-align: center;
}

.you-draw-it .intro {
  text-align: center;
  color: #666;
  margin-bottom: 32px;
  font-size: 0.95rem;
}

/* Annotation form */
.ydi-annotation-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 12px;
  margin-bottom: 12px;
  padding-bottom: 12px;
  border-bottom: 1px dashed #eee;
}
.ydi-annotation-row .ann-label-wrap {
  grid-column: 1 / -1;
  display: flex;
  gap: 8px;
  align-items: end;
  flex-wrap: wrap;
}
.ydi-annotation-row .ann-label-wrap label { flex: 0 0 100%; font-size: 0.85rem; font-weight: 600; color: #555; }
.ydi-annotation-row .ann-label-wrap input { flex: 1; min-width: 0; }
.ydi-annotation-row .ann-remove {
  flex: none;
  background: none; border: 1px solid #ddd; border-radius: 4px;
  font-size: 0.95rem; cursor: pointer; color: #999;
  padding: 8px 10px;
}
.ydi-annotation-row .ann-remove:hover { color: #c00; border-color: #c00; }
#add-annotation {
  background: none; border: 1px dashed #ccc; border-radius: 4px;
  padding: 6px 14px; font-size: 0.85rem; color: #888; cursor: pointer;
  margin-top: 4px;
}
#add-annotation:hover { border-color: #999; color: #555; }

/* --- Quiz creation form --- */
.ydi-create {
  margin-bottom: 32px;
  padding: 20px;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border: 1px solid #eee;
  border-radius: 8px;
}
.ydi-create h2 {
  font-size: 1.1rem;
  font-weight: 700;
  margin-top: 0;
  margin-bottom: 0;
}
.ydi-create label {
  display: block;
  font-size: 0.85rem;
  font-weight: 600;
  color: #555;
  margin-bottom: 4px;
}
.ydi-create input[type="text"],
.ydi-create select {
  width: 100%;
  padding: 8px 12px;
  font-size: 0.95rem;
  border: 1px solid #ccc;
  border-radius: 4px;
  margin-bottom: 14px;
}
.ydi-create input:focus,
.ydi-create select:focus {
  outline: none;
  border-color: #333;
}
.ydi-data-source {
  font-size: 0.75rem;
  color: #aaa;
  margin: 4px 0 8px;
}
.ydi-data-source a {
  color: #aaa;
  text-decoration: underline;
}
.ydi-data-source a:hover {
  color: #666;
}
.ydi-create .ydi-field-row {
  display: flex;
  gap: 12px;
}
.ydi-create .ydi-field-row > div {
  flex: 1;
}

/* Drop zone */
.ydi-dropzone {
  border: 2px dashed #ccc;
  border-radius: 8px;
  padding: 24px 16px;
  text-align: center;
  color: #999;
  font-size: 0.9rem;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  margin-bottom: 14px;
}
.ydi-dropzone:hover,
.ydi-dropzone.dragover {
  border-color: #666;
  background: #f0f0f0;
}
.ydi-dropzone.loaded {
  border-color: #4caf50;
  background: #e8f5e9;
  color: #2e7d32;
}
.ydi-dropzone input[type="file"] {
  display: none;
}
.ydi-data-preview {
  max-height: 150px;
  overflow-y: auto;
  font-size: 0.8rem;
  margin-bottom: 14px;
  border: 1px solid #eee;
  border-radius: 4px;
}
.ydi-data-preview table {
  width: 100%;
  border-collapse: collapse;
}
.ydi-data-preview th,
.ydi-data-preview td {
  padding: 4px 8px;
  text-align: right;
  border-bottom: 1px solid #f0f0f0;
}
.ydi-data-preview th {
  background: #f8f8f8;
  font-weight: 600;
  position: sticky;
  top: 0;
}
.ydi-preview-section {
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid #eee;
}
.ydi-preview-section h3 {
  font-size: 0.95rem;
  font-weight: 600;
  margin-bottom: 8px;
  color: #666;
}

/* --- Two-column layout --- */
.ydi-two-column {
  display: flex;
  gap: 24px;
  align-items: flex-start;
}
.ydi-left-panel {
  flex: 0 0 420px;
  min-width: 0;
}
.ydi-right-panel {
  flex: 1 1 0;
  min-width: 0;
}
.ydi-preview-sticky {
  position: -webkit-sticky;
  position: sticky;
  top: 80px;
  background: #fff;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border: 1px solid #eee;
  border-radius: 8px;
  padding: 20px;
}
.ydi-preview-sticky .ydi-chart-wrap {
  margin-bottom: 0;
  box-shadow: none;
}

/* --- Accordion --- */
.ydi-accordion-step {
  border-bottom: 1px solid #eee;
}
.ydi-accordion-step:last-child {
  border-bottom: none;
}
.ydi-step-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  padding: 14px 0;
  user-select: none;
}
.ydi-step-header h2 {
  margin: 0;
  pointer-events: none;
}
.ydi-step-header .ydi-chevron {
  transition: transform 0.3s;
  font-size: 0.75rem;
  color: #999;
}
.ydi-accordion-step.open .ydi-chevron {
  transform: rotate(180deg);
}
.ydi-step-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.35s ease;
}
.ydi-accordion-step.open .ydi-step-body {
  max-height: 2000px;
  padding-bottom: 8px;
}

/* --- Preview placeholder --- */
.ydi-preview-placeholder {
  border: 2px dashed #ccc;
  border-radius: 8px;
  padding: 60px 20px;
  text-align: center;
  color: #999;
  font-size: 0.9rem;
  background: #fafafa;
}

/* --- Responsive --- */
@media (max-width: 900px) {
  .ydi-two-column { flex-direction: column; }
  .ydi-left-panel { flex: none; width: 100%; }
  .ydi-right-panel { flex: none; width: 100%; }
  .ydi-preview-sticky { position: static; }
}
@media (max-width: 600px) {
  .you-draw-it { padding: 108px 8px 12px; }
  .you-draw-it h1 { font-size: 1.3rem; }
}
</style>
</head>
<body>

<dataviz-tool-header></dataviz-tool-header>

<div class="you-draw-it" id="app">
  <h1>描いて答える折れ線グラフ</h1>
  <p class="intro">データをアップロードして、クイズを作成しよう。</p>

  <div class="ydi-two-column">
    <!-- 左パネル: 設定フォーム -->
    <div class="ydi-left-panel">
      <div class="ydi-create" id="create-form">

        <!-- Step 1: データアップロード -->
        <div class="ydi-accordion-step open" data-step="1">
          <div class="ydi-step-header">
            <h2>1. データをアップロード</h2>
            <span class="ydi-chevron">&#9660;</span>
          </div>
          <div class="ydi-step-body">
            <p class="ydi-data-source" id="data-source"></p>
            <div class="ydi-dropzone" id="dropzone">
              <p>CSVファイルをドラッグ＆ドロップ、またはクリックして選択</p>
              <input type="file" id="file-input" accept=".csv,.json">
            </div>
            <div class="ydi-field-row" id="col-select-row" style="display:none; margin-top: 12px">
              <div>
                <label for="col-x">X軸（時系列）</label>
                <select id="col-x"></select>
              </div>
              <div>
                <label for="col-y">Y軸（数値）</label>
                <select id="col-y"></select>
              </div>
            </div>
            <div class="ydi-field-row" id="data-preview" style="display:none">
              <div class="ydi-data-preview" id="data-preview-x"></div>
              <div class="ydi-data-preview" id="data-preview-y"></div>
            </div>
          </div>
        </div>

        <!-- Step 2: 対象期間 -->
        <div class="ydi-accordion-step" data-step="2">
          <div class="ydi-step-header">
            <h2>2. 対象期間</h2>
            <span class="ydi-chevron">&#9660;</span>
          </div>
          <div class="ydi-step-body">
            <div class="ydi-field-row" id="period-select-row" style="display:none">
              <div>
                <label for="period-start">開始</label>
                <select id="period-start" disabled>
                  <option value="">データを先にアップロード</option>
                </select>
              </div>
              <div>
                <label for="period-end">終了</label>
                <select id="period-end" disabled>
                  <option value="">データを先にアップロード</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <!-- Step 3: クイズの設定 -->
        <div class="ydi-accordion-step" data-step="3">
          <div class="ydi-step-header">
            <h2>3. クイズの設定</h2>
            <span class="ydi-chevron">&#9660;</span>
          </div>
          <div class="ydi-step-body">
            <label for="quiz-title">タイトル（質問文）</label>
            <input type="text" id="quiz-title" placeholder="例: 日本の人口はどう推移した？">

            <div class="ydi-field-row">
              <div>
                <label for="quiz-draw-start">ここから予想（出題範囲の開始）</label>
                <select id="quiz-draw-start" disabled>
                  <option value="">データを先にアップロード</option>
                </select>
              </div>
              <div>
                <label for="quiz-unit">単位（任意）</label>
                <input type="text" id="quiz-unit" placeholder="例: %, 万人, $">
              </div>
            </div>

            <div class="ydi-field-row">
              <div>
                <label for="quiz-style">スタイル</label>
                <select id="quiz-style">
                  <option value="">標準</option>
                  <option value="sketchy">手書き風</option>
                </select>
              </div>
              <div></div>
            </div>
          </div>
        </div>

        <!-- Step 4: アノテーション -->
        <div class="ydi-accordion-step" data-step="4">
          <div class="ydi-step-header">
            <h2>4. 期間アノテーション（任意）</h2>
            <span class="ydi-chevron">&#9660;</span>
          </div>
          <div class="ydi-step-body">
            <div class="ydi-field-row" style="margin-bottom:8px">
              <div>
                <label for="ann-granularity">期間の粒度</label>
                <select id="ann-granularity">
                  <option value="year">年</option>
                  <option value="yyyymm">年月</option>
                </select>
              </div>
              <div></div>
            </div>
            <div id="annotations-list"></div>
            <button type="button" id="add-annotation">+ 期間を追加</button>
          </div>
        </div>

      </div>
    </div>

    <!-- 右パネル: プレビュー -->
    <div class="ydi-right-panel">
      <div class="ydi-preview-sticky">
        <div class="ydi-preview-placeholder" id="preview-placeholder">
          <p>データをアップロードすると<br>プレビューが表示されます</p>
        </div>
        <div class="ydi-preview-section" id="preview-section" style="display:none">
          <div id="preview-container"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { ChartInstance } from "./ydi-chart.js";
import { generateThumbnailDataUri, cloneChartSvg } from "./ydi-export.js";

// ============================================================
//  描いて答える折れ線グラフ — 作成エディタ
// ============================================================

let uploadedData = null; // [{x, y}, ...]
let csvRawRows = null;   // CSVの生データ（列選択変更用）
let csvCols = null;      // CSVの列名リスト
let currentXFormat = "year"; // "year" or "yyyymm"

const {
  appendSanitizedHtml,
  createSingleColumnTable,
  populateSelect,
} = window.dvzDom;

function mountChart(container, cfg) {
  return new ChartInstance(container, cfg, { sanitizeHtml: appendSanitizedHtml });
}

// --------------- API設定 ---------------
const APP_NAME = "drawing-line-chart";

// --------------- Quiz用Supabaseクライアント ---------------
const SUPABASE_URL = "https://vebhoeiltxspsurqoxvl.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_sAjwbAhC0jnIRjNa34QuTA_CcksMYQG";
const quizSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// --------------- チャート描画・再描画 ---------------
let currentConfigs = [];
let currentProjectId = null;
let currentProjectName = null;

// --------------- サムネイル生成 ---------------
async function generateThumbnail() {
  return generateThumbnailDataUri(document.querySelector(".ydi-chart-wrap svg"));
}

// --------------- 認証 / Share helpers ---------------
const DEPLOY_ORIGIN = "https://drawing-line-chart.dataviz.jp";

async function waitForDatavizAuthReady(timeoutMs = 5000) {
  if (window.datavizSupabase) return window.datavizSupabase;

  return new Promise((resolve) => {
    const startedAt = Date.now();
    const check = setInterval(() => {
      if (window.datavizSupabase) {
        clearInterval(check);
        resolve(window.datavizSupabase);
        return;
      }

      if (Date.now() - startedAt >= timeoutMs) {
        clearInterval(check);
        resolve(null);
      }
    }, 200);
  });
}

async function getAccessToken() {
  await waitForDatavizAuthReady();
  if (!window.datavizSupabase) return null;
  const { data: { session } } = await window.datavizSupabase.auth.getSession();
  return session?.access_token || null;
}

function getToolHeader() {
  return document.querySelector("dataviz-tool-header");
}

async function waitForToolHeaderReady(timeoutMs = 5000) {
  const current = getToolHeader();
  if (current && typeof current.setConfig === "function") return current;

  if (window.customElements && typeof window.customElements.whenDefined === "function") {
    try {
      await window.customElements.whenDefined("dataviz-tool-header");
    } catch (_error) {}
  }

  return new Promise((resolve) => {
    const startedAt = Date.now();
    const check = setInterval(() => {
      const header = getToolHeader();
      if (header && typeof header.setConfig === "function") {
        clearInterval(check);
        resolve(header);
        return;
      }

      if (Date.now() - startedAt >= timeoutMs) {
        clearInterval(check);
        resolve(header || null);
      }
    }, 100);
  });
}

function showMessage(msg, type = "info", duration) {
  const th = getToolHeader();
  if (th && th.showMessage) {
    th.showMessage(msg, type, duration);
  } else {
    alert(msg);
  }
}

function showProcessingToast(msg, duration = 5000) {
  showMessage(msg || "処理中です", "info", duration);
}

function installHeaderProcessingToasts(header) {
  if (!header || header.__dvzNativeProjectProcessingToasts === "1" || header.__dvzProcessingToastsInstalled === "1") return;

  if (typeof header.showLoadModal === "function") {
    const originalShowLoadModal = header.showLoadModal.bind(header);
    header.showLoadModal = (...args) => {
      showProcessingToast("プロジェクト一覧を読み込み中です");
      return originalShowLoadModal(...args);
    };
  }

  if (typeof header.loadProject === "function") {
    const originalLoadProject = header.loadProject.bind(header);
    header.loadProject = (...args) => {
      showProcessingToast("プロジェクトを読み込み中です");
      return originalLoadProject(...args);
    };
  }

  if (typeof header.saveProject === "function") {
    const originalSaveProject = header.saveProject.bind(header);
    header.saveProject = (...args) => {
      showProcessingToast("プロジェクトを保存中です");
      return originalSaveProject(...args);
    };
  }

  header.__dvzProcessingToastsInstalled = "1";
}

function normalizeSavedProjectMeta(meta) {
  const project = meta?.project && typeof meta.project === "object" ? meta.project : null;
  return {
    id: meta?.id || project?.id || null,
    name: meta?.name || project?.name || null,
  };
}

function getCurrentProjectPayload() {
  const cfg = buildConfig();
  const charts = cfg ? [cfg] : currentConfigs;
  if (!Array.isArray(charts) || !charts.length) return null;
  return { charts, version: 1 };
}

async function buildEditorSavePayload() {
  const data = getCurrentProjectPayload();
  if (!data) return null;

  const cfg = buildConfig();
  const fallbackTitle = currentConfigs[0]?.title || "新しいプロジェクト";
  return {
    name: currentProjectName || cfg?.title || fallbackTitle,
    data,
    thumbnailDataUri: await generateThumbnail(),
    existingProjectId: currentProjectId,
  };
}

function getCurrentQuizShareTitle() {
  const cfg = buildConfig();
  const candidates = [
    cfg?.title,
    currentConfigs[0]?.title,
    currentProjectName,
    "描いて答える折れ線グラフ",
  ];
  return candidates.map((value) => String(value || "").trim()).find(Boolean) || "描いて答える折れ線グラフ";
}

function escapeHtmlAttr(value) {
  return String(value || "")
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function buildPublicQuizUrl(quizId) {
  return `${DEPLOY_ORIGIN}/quiz.html?id=${encodeURIComponent(quizId)}`;
}

function buildQuizEmbedSrc(quizId) {
  return `${buildPublicQuizUrl(quizId)}&embed=1`;
}

function buildQuizIframeEmbedCode(quizId, rawTitle) {
  const resolvedTitle = String(rawTitle || "").trim();
  const title = escapeHtmlAttr(resolvedTitle ? `${resolvedTitle} - 描いて答える折れ線グラフ` : "描いて答える折れ線グラフ");
  return `<iframe title="${title}" src="${buildQuizEmbedSrc(quizId)}" frameborder="0" scrolling="auto" allow="fullscreen; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" loading="lazy" allowfullscreen="true" style="display:block;width:100%;max-width:100%;min-height:600px;border:0;margin:0 auto;padding:0;"></iframe>`;
}

function getApiErrorMessage(payload, fallback) {
  if (typeof payload?.error === "string") return payload.error;
  if (typeof payload?.error?.message === "string") return payload.error.message;
  if (typeof payload?.message === "string") return payload.message;
  return fallback;
}

async function publishQuizFromProject(options = {}) {
  const projectId = String(options.projectId || "").trim();
  if (!projectId) {
    throw new Error("シェアする前にプロジェクトを保存してください");
  }

  const accessToken = await getAccessToken();
  if (!accessToken) {
    throw new Error("Login required");
  }

  const response = await fetch(`${SUPABASE_URL}/functions/v1/publish-drawing-line-chart-quiz`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-Dataviz-Authorization": `Bearer ${accessToken}`,
    },
    body: JSON.stringify({
      projectId,
      fallbackTitle: String(options.fallbackTitle || "").trim() || null,
    }),
  });

  const payload = await response.json().catch(() => null);
  if (!response.ok) {
    throw new Error(getApiErrorMessage(payload, `Share publish failed (${response.status})`));
  }
  return payload || {};
}

async function generateQuizOgImage(title) {
  const svgEl = document.querySelector(".ydi-chart-wrap svg");
  if (!svgEl) return null;

  const clone = await cloneChartSvg(svgEl, { extraText: title || "" });
  const svgData = new XMLSerializer().serializeToString(clone);
  const blob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
  const url = URL.createObjectURL(blob);

  try {
    const img = await new Promise((resolve, reject) => {
      const candidate = new Image();
      candidate.onload = () => resolve(candidate);
      candidate.onerror = reject;
      candidate.src = url;
    });

    const ogWidth = 1200;
    const ogHeight = 630;
    const canvas = document.createElement("canvas");
    canvas.width = ogWidth;
    canvas.height = ogHeight;

    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, ogWidth, ogHeight);

    const scale = Math.min(ogWidth / img.naturalWidth, (ogHeight - 60) / img.naturalHeight);
    const dx = (ogWidth - img.naturalWidth * scale) / 2;
    const dy = (ogHeight - 60 - img.naturalHeight * scale) / 2;
    ctx.drawImage(img, dx, dy, img.naturalWidth * scale, img.naturalHeight * scale);

    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, ogHeight - 60, ogWidth, 60);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 24px -apple-system, BlinkMacSystemFont, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(title || "描いて答える折れ線グラフ", ogWidth / 2, ogHeight - 30);

    return await new Promise((resolve, reject) => {
      canvas.toBlob((pngBlob) => {
        if (pngBlob) resolve(pngBlob);
        else reject(new Error("toBlob failed"));
      }, "image/png");
    });
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function uploadQuizOgImage(quizId, pngBlob) {
  if (!pngBlob) return null;

  const { error } = await quizSupabase.storage
    .from("quiz-og-images")
    .upload(`quiz/${quizId}.png`, pngBlob, { contentType: "image/png", upsert: true });

  if (error) {
    console.warn("Quiz OG image upload failed:", error.message);
    return null;
  }

  return `${SUPABASE_URL}/storage/v1/object/public/quiz-og-images/quiz/${quizId}.png`;
}

// --------------- ?data_url / ?projectId 自動読込 ---------------
async function autoLoadFromURL() {
  const params = new URLSearchParams(window.location.search);

  const dataUrl = params.get("data_url");
  if (dataUrl) {
    try {
      const res = await fetch(dataUrl);
      const text = await res.text();
      const blob = new Blob([text], { type: "text/csv" });
      const file = new File([blob], dataUrl.split("/").pop() || "data.csv", { type: "text/csv" });
      handleFile(file);
    } catch (err) {
      console.error("data_url load failed:", err);
    }
    window.history.replaceState({}, document.title, window.location.pathname);
    return;
  }

  const projectId = params.get("projectId");
  if (!projectId) return;

  await waitForDatavizAuthReady();
  const token = await getAccessToken();
  if (!token) return;

  try {
    const header = await waitForToolHeaderReady();
    if (header && typeof header.loadProject === "function") {
      const data = await header.loadProject(projectId);
      if (data && data.charts && Array.isArray(data.charts)) {
        restoreFormFromConfig(data.charts[0]);
        currentProjectId = projectId;
      }
    }
  } catch (e) {
    console.error("Auto-load failed:", e);
  }
}

function restoreFormFromConfig(cfg) {
  if (!cfg || !cfg.data) return;
  uploadedData = cfg.data;
  if (cfg.xFormat) currentXFormat = cfg.xFormat;
  onDataLoaded();
  document.getElementById("quiz-title").value = cfg.title || "";
  document.getElementById("quiz-unit").value = cfg.unit || "";
  document.getElementById("quiz-style").value = cfg.style || "";
  document.getElementById("annotations-list").replaceChildren();

  }
  if (cfg.drawStartX) {
    document.getElementById("quiz-draw-start").value = cfg.drawStartX;
  }

  const placeholder = document.getElementById("preview-placeholder");
  if (placeholder) placeholder.style.display = "none";

    toolHeader.loadProject = async (projectId, ...args) => {
      const data = await originalLoadProject(projectId, ...args);
      const normalizedProjectId = typeof projectId === "string" ? projectId.trim() : "";
      if (data && normalizedProjectId) {
        currentProjectId = normalizedProjectId;
      }

    ],
  });

  toolHeader.setProjectConfig({
    appName: APP_NAME,

      if (projectData.charts && Array.isArray(projectData.charts)) {
        restoreFormFromConfig(projectData.charts[0]);

    toolId: "drawing-line-chart",

/// 時系列列判定: 年(4桁)、年月(6桁YYYYMM)、日付文字列を含む列
function isTimeSeriesCol(rows, col) {
  const sample = rows.slice(0, Math.min(10, rows.length));
  return sample.filter(r => {
    const v = String(r[col]).trim();
    return /^\d{4}$/.test(v) || /^\d{6}$/.test(v) || /\d{4}[-\/]/.test(v);
  }).length > sample.length * 0.5;
}

// YYYYMM → 小数年に変換（例: 201003 → 2010.167）
function parseTimeValue(raw) {
  const s = String(raw).trim();
  // YYYYMM (6桁数値)
  if (/^\d{6}$/.test(s)) {
    const y = parseInt(s.slice(0, 4));
    const m = parseInt(s.slice(4, 6));
    return y + (m - 1) / 12;
  }
  // YYYY/MM or YYYY-MM
  const ymMatch = s.match(/^(\d{4})[\/\-](\d{1,2})$/);
  if (ymMatch) {
    return parseInt(ymMatch[1]) + (parseInt(ymMatch[2]) - 1) / 12;
  }
  // YYYY/MM/DD or YYYY-MM-DD → 年月に変換
  const ymdMatch = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-]\d{1,2}$/);
  if (ymdMatch) {
    return parseInt(ymdMatch[1]) + (parseInt(ymdMatch[2]) - 1) / 12;
  }
  let x = parseFloat(s);
  if (isNaN(x)) {
    const dateMatch = s.match(/(\d{4})/);
    if (dateMatch) x = parseInt(dateMatch[1]);
  }
  return x;
}

// 小数年をラベルに変換（ドロップダウン表示用）
function formatXForDropdown(val) {
  if (currentXFormat === "yyyymm") {
    const y = Math.floor(val);
    const m = Math.round((val - y) * 12) + 1;
    return y + "/" + String(m).padStart(2, "0");
  }
  return String(val);
}

// X軸のフォーマッタを決定（YYYYMM形式か年のみか）
function detectXFormat(rows, col) {
  const sample = rows.slice(0, Math.min(10, rows.length));
  const hasMonthly = sample.filter(r => {
    const v = String(r[col]).trim();
    return /^\d{6}$/.test(v) || /^\d{4}[\/\-]\d{1,2}$/.test(v) || /^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/.test(v);
  }).length > sample.length * 0.5;
  return hasMonthly ? "yyyymm" : "year";
}
// 数値列判定: 大半の行が数値に変換できる列
function isNumericCol(rows, col) {
  const sample = rows.slice(0, Math.min(10, rows.length));
  return sample.filter(r => !isNaN(parseFloat(String(r[col]).replace(/,/g, "")))).length > sample.length * 0.5;
}

// 選択中の列でデータをパースし直す
function parseWithColumns(xColName, yColName) {
  if (!csvRawRows) return;
  currentXFormat = detectXFormat(csvRawRows, xColName);
  const parsed = csvRawRows.map(d => {
    const rawX = d[xColName];
    const rawY = d[yColName];
    const x = parseTimeValue(rawX);
    const y = parseFloat(String(rawY).replace(/,/g, ""));
    return { x, y };
  }).filter(d => !isNaN(d.x) && !isNaN(d.y));

  if (parsed.length < 2) {
    showMessage("有効なデータが2行未満です。列の選択を確認してください。", "error");
    return;
  }
  const dupX = parsed.map(d => d.x).filter((v, i, a) => a.indexOf(v) !== i);
  if (dupX.length > 0) {
    showMessage("X軸に重複があります。データを整理してください。", "error");
    return;
  }
  parsed.sort((a, b) => a.x - b.x);
  uploadedData = parsed;
  onDataLoaded();
}

function handleFile(file) {
  document.getElementById("data-source").replaceChildren();
  showProcessingToast("ファイルを読み込み中です");
  const reader = new FileReader();
  reader.onload = (e) => {
    const text = e.target.result;
    try {
      let parsed;
      if (file.name.endsWith(".json")) {
        parsed = JSON.parse(text);
        if (!Array.isArray(parsed)) throw new Error("JSONは配列形式にしてください");
        csvRawRows = null;
        csvCols = null;
        document.getElementById("col-select-row").style.display = "none";
      } else {
        const rows = d3.csvParse(text);
        const cols = Object.keys(rows[0] || {});
        if (cols.length < 2) throw new Error("2列以上のCSVが必要です");

        csvRawRows = rows;
        csvCols = cols;

        // 自動検出
        const autoX = cols.find(c => isTimeSeriesCol(rows, c));
        const autoY = cols.find(c => c !== autoX && isNumericCol(rows, c));
        if (!autoX || !autoY) throw new Error("時系列列と数値列が見つかりません");

        // ドロップダウンを設定（Y軸は数値列のみ）
        const colXSel = document.getElementById("col-x");
        const colYSel = document.getElementById("col-y");
        const numericCols = cols.filter(c => isNumericCol(rows, c));
        populateSelect(colXSel, cols.map(c => ({ value: c, label: c })), autoX);
        populateSelect(colYSel, numericCols.map(c => ({ value: c, label: c })), autoY);
        document.getElementById("col-select-row").style.display = "";

        currentXFormat = detectXFormat(rows, autoX);
        parsed = rows.map(d => {
          const rawX = d[autoX];
          const rawY = d[autoY];
          const x = parseTimeValue(rawX);
          const y = parseFloat(String(rawY).replace(/,/g, ""));
          return { x, y };
        });
      }
      // Validate
      parsed = parsed.filter(d => !isNaN(d.x) && !isNaN(d.y));
      if (parsed.length < 2) throw new Error("2点以上のデータが必要です");
      const dupX = parsed.map(d => d.x).filter((v, i, a) => a.indexOf(v) !== i);
      if (dupX.length > 0) {
        throw new Error("X軸に重複があります。データを整理してください。");
      }
      parsed.sort((a, b) => a.x - b.x);

      uploadedData = parsed;
      onDataLoaded();
    } catch (err) {
      showMessage("データの読み込みに失敗: " + err.message, "error");
    }
  };
  reader.readAsText(file);
}

// 対象期間に応じたデータをフィルタして返す
function getFilteredData() {
  if (!uploadedData) return null;
  const startVal = parseFloat(document.getElementById("period-start").value);
  const endVal = parseFloat(document.getElementById("period-end").value);
  if (isNaN(startVal) || isNaN(endVal)) return uploadedData;
  return uploadedData.filter(d => d.x >= startVal && d.x <= endVal);
}

// 対象期間が変わったらdrawStartXのドロップダウンを再設定
function populateDrawStart() {
  const filtered = getFilteredData();
  if (!filtered || filtered.length < 2) return;
  drawStartSelect.replaceChildren();
  drawStartSelect.disabled = false;
  const xValues = filtered.map(d => d.x);
  const midIdx = Math.floor(xValues.length / 2);
  xValues.forEach((x, i) => {
    if (i === 0 || i === xValues.length - 1) return;
    const opt = document.createElement("option");
    opt.value = x;
    opt.textContent = formatXForDropdown(x);
    if (i === midIdx) opt.selected = true;
    drawStartSelect.appendChild(opt);
  });
}

document.getElementById("period-start").addEventListener("change", () => { populateDrawStart(); updatePreview(); });
document.getElementById("period-end").addEventListener("change", () => { populateDrawStart(); updatePreview(); });

function updatePreview() {
  if (!uploadedData) return;
  clearTimeout(previewDebounce);
  previewDebounce = setTimeout(() => {
    const cfg = buildConfig();
    if (!cfg) return;

    const placeholder = document.getElementById("preview-placeholder");
    if (placeholder) placeholder.style.display = "none";
    previewSection.style.display = "block";

    previewContainer.querySelectorAll(".ydi-chart-wrap").forEach(el => el.remove());

    currentConfigs = [cfg];
    mountChart(previewContainer, cfg);
  }, 200);
}

function buildConfig() {
  const filtered = getFilteredData();
  if (!filtered || filtered.length < 3) return null;
  const drawStartX = parseFloat(drawStartSelect.value);
  if (isNaN(drawStartX)) return null;

  const styleVal = document.getElementById("quiz-style").value;

  document.querySelectorAll(".ydi-annotation-row").forEach(row => {
    const startX = parseFloat(row.querySelector(".ann-start").value);
    const endX = parseFloat(row.querySelector(".ann-end").value);

    if (!isNaN(startX) && !isNaN(endX)) {
      annotations.push({ startX, endX, label: label || "" });
    }
  });
  return {
    id: "preview",
    title: titleInput.value || "タイトル未設定",
    data: filtered,
    drawStartX: drawStartX,
    unit: unitInput.value || "",
    style: styleVal || undefined,
    xFormat: currentXFormat !== "year" ? currentXFormat : undefined,
    annotations: annotations.length > 0 ? annotations : undefined,
    yFormat: ",.0f",
    precision: 0,
    yExtent: 1.5,
    buttonText: "答え合わせ",
    drawPrompt: ["線を描いて", "予想してみよう"],
  };
}

// Annotation add/remove
const annGranularity = document.getElementById("ann-granularity");

// アノテーション粒度に応じた選択肢を生成
function getAnnotationOptionItems() {
  const filtered = getFilteredData();
  if (!filtered || filtered.length < 2) return [];
  const granularity = annGranularity.value;
  const minX = Math.floor(filtered[0].x);
  const maxX = Math.ceil(filtered[filtered.length - 1].x);
  const values = [];
  if (granularity === "yyyymm") {
    for (let y = minX; y <= maxX; y++) {
      for (let m = 1; m <= 12; m++) {
        const val = +(y + (m - 1) / 12).toFixed(6);
        values.push({ val, label: y + "/" + String(m).padStart(2, "0") });
      }
    }
  } else {
    for (let y = minX; y <= maxX; y++) {
      values.push({ val: y, label: String(y) });
    }
  }
  return values;
}

function populateAnnotationSelect(selectEl, selectedVal) {
  const values = getAnnotationOptionItems();
  populateSelect(selectEl, values.map(v => ({ value: v.val, label: v.label })));
  if (selectedVal !== undefined) {
    const selected = values.find(v => Math.abs(v.val - selectedVal) < 0.001);
    if (selected) selectEl.value = String(selected.val);
  }
  return values.length;
}

function addAnnotationRow(startX, endX, label) {
  const list = document.getElementById("annotations-list");
  const row = document.createElement("div");
  row.className = "ydi-annotation-row";

  const startWrap = document.createElement("div");
  const startLabel = document.createElement("label");
  startLabel.textContent = "開始";
  const startSel = document.createElement("select");
  startSel.className = "ann-start";
  startWrap.append(startLabel, startSel);

  const endWrap = document.createElement("div");
  const endLabel = document.createElement("label");
  endLabel.textContent = "終了";
  const endSel = document.createElement("select");
  endSel.className = "ann-end";
  endWrap.append(endLabel, endSel);

  if (!populateAnnotationSelect(startSel, startX)) return;
  populateAnnotationSelect(endSel, endX);

  const labelWrap = document.createElement("div");
  labelWrap.className = "ann-label-wrap";
  const labelLabel = document.createElement("label");
  labelLabel.textContent = "ラベル";
  const labelInput = document.createElement("input");
  labelInput.type = "text";
  labelInput.className = "ann-label";
  labelInput.placeholder = "例: 高市内閣";
  labelInput.value = label || "";
  const removeBtn = document.createElement("button");
  removeBtn.type = "button";
  removeBtn.className = "ann-remove";
  removeBtn.textContent = "×";
  labelWrap.append(labelLabel, labelInput, removeBtn);

  row.append(startWrap, endWrap, labelWrap);
  row.querySelectorAll("select, input").forEach(el => el.addEventListener("change", updatePreview));
  row.querySelector(".ann-label").addEventListener("input", updatePreview);
  list.appendChild(row);
  updatePreview();
}

// 粒度変更時: 既存アノテーション行の選択肢を再生成（値とラベルは保持）
annGranularity.addEventListener("change", () => {
  document.querySelectorAll(".ydi-annotation-row").forEach(row => {
    const startSel = row.querySelector(".ann-start");
    const endSel = row.querySelector(".ann-end");
    const startVal = parseFloat(startSel.value);
    const endVal = parseFloat(endSel.value);
    populateAnnotationSelect(startSel, startVal);
    populateAnnotationSelect(endSel, endVal);
  });
  updatePreview();
});
document.getElementById("add-annotation").addEventListener("click", () => addAnnotationRow());
document.getElementById("annotations-list").addEventListener("click", (e) => {
  if (e.target.classList.contains("ann-remove")) {
    e.target.closest(".ydi-annotation-row").remove();
    updatePreview();
  }
});

// --------------- アコーディオン制御 ---------------
function openStep(n) {
  const step = document.querySelector(`.ydi-accordion-step[data-step="${n}"]`);
  if (step) step.classList.add("open");
}
function closeStep(n) {
  const step = document.querySelector(`.ydi-accordion-step[data-step="${n}"]`);
  if (step) step.classList.remove("open");
}
document.querySelectorAll(".ydi-step-header").forEach(header => {
  header.addEventListener("click", () => {
    header.closest(".ydi-accordion-step").classList.toggle("open");
  });
});

// --------------- 初期化 ---------------
// No default charts — user uploads data

// ツールヘッダーはdeferで遅延読込されるため、DOMContentLoadedで設定
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", setupToolHeader);
} else {
  setTimeout(setupToolHeader, 100);
}

// URL自動読込（プロジェクト読込時はフォームを復元）
autoLoadFromURL();
</script>
</body>
</html>
