<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>結果をみる — 描いて答える折れ線グラフ</title>
<!-- OGP meta tags (defaults — updated dynamically via JS) -->
<meta property="og:type" content="website">
<meta property="og:title" content="">
<meta property="og:description" content="">
<meta property="og:site_name" content="">
<meta property="og:url" content="">
<meta property="og:image" content="">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="">
<meta name="twitter:description" content="">
<meta name="twitter:image" content="">
<!-- Google tag (gtag.js) — embed時はPV抑制 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-WXY3CQ3RNF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  if (new URLSearchParams(location.search).get('embed') !== '1') {
    gtag('config', 'G-WXY3CQ3RNF');
  }
</script>
<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- D3.js -->
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="d3.sketchy.js"></script>
<link rel="stylesheet" href="ydi-page.css">
<link rel="stylesheet" href="ydi-chart.css">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&display=swap" rel="stylesheet">
</head>
<body>

<div class="dvz-app">
  <div id="dvz-loading"></div>
  <div id="dvz-error" style="display:none"></div>
  <div id="dvz-content" style="display:none"></div>
  <div id="dvz-result" class="dvz-result" style="display:none"></div>
  <div class="dvz-site-links">
    <a href="https://www.dataviz.jp/drawing-line-chart/" target="_blank" rel="noopener"></a>
    <span>|</span>
    <a href="https://www.dataviz.jp/" target="_blank" rel="noopener">dataviz.jp</a>
  </div>
</div>

<script type="module">
import { ChartInstance } from "./ydi-chart.js";
import { downloadChartPng } from "./ydi-export.js";
import { createQuizClient, quizPageUrl, resultPageUrl, resultOgPath, ogPublicUrl } from "./ydi-config.js";
import {
  createI18n, setupEmbedMode, fillSiteLinks, showLoading, hideLoading, showPageError, startLoadTimeout,
} from "./ydi-public.js";

// ============================================================
//  Share Page — 描いて答える折れ線グラフ（回答結果の静的表示）
// ============================================================

const { t } = createI18n({
  ja: {
    loading: '読み込み中...',
    noId: '回答IDが指定されていません',
    notFound: '回答データが見つかりませんでした',
    error: 'エラーが発生しました',
    timeout: '読み込みがタイムアウトしました。ページを再読み込みしてください。',
    resultSuffix: '結果をみる',
    ogDesc: '折れ線グラフの予想結果をチェック！あなたも予想してみよう',
    ogSiteName: '描いて答える折れ線グラフ',
    answered: '回答済み',
    trySelf: '自分もやってみる',
    saveImage: '画像を保存',
    legendPrediction: '予想',
    legendActual: '実際',
    resultLabel: '結果',
    toolName: '描いて答える折れ線グラフ',
  },
  en: {
    loading: 'Loading...',
    noId: 'No response ID provided',
    notFound: 'Response data not found',
    error: 'An error occurred',
    timeout: 'Loading timed out. Please reload the page.',
    resultSuffix: 'Results',
    ogDesc: 'Check out these line chart prediction results! Try it yourself.',
    ogSiteName: 'Draw & Predict Line Chart',
    answered: 'Answered',
    trySelf: 'Try it yourself',
    saveImage: 'Save image',
    legendPrediction: 'Prediction',
    legendActual: 'Actual',
    resultLabel: 'Result',
    toolName: 'Draw & Predict Line Chart',
  }
});

setupEmbedMode();
showLoading(t('loading'));
fillSiteLinks(t('toolName'));

const quizSupabase = createQuizClient();

function setMeta(property, content) {
  const el = document.querySelector(`meta[property="${property}"]`)
          || document.querySelector(`meta[name="${property}"]`);
  if (el) el.setAttribute('content', content);
}

function updateOgpMeta(responseId, ogTitle) {
  const ogImageUrl = ogPublicUrl(resultOgPath(responseId));
  setMeta("og:title", ogTitle);
  setMeta("og:description", t('ogDesc'));
  setMeta("og:site_name", t('ogSiteName'));
  setMeta("og:url", resultPageUrl(responseId));
  setMeta("og:image", ogImageUrl);
  setMeta("twitter:title", ogTitle);
  setMeta("twitter:description", t('ogDesc'));
  setMeta("twitter:image", ogImageUrl);
}

function scoreClass(totalError) {
  if (totalError < 0.5) return "ydi-score-good";
  if (totalError >= 2) return "ydi-score-off";
  return "ydi-score-ok";
}

// スコアバッジ + CTA（ユーザー由来の文字列は textContent）
function renderResult(resultEl, response, quiz, getSvg) {
  const scoreEl = document.createElement("div");
  scoreEl.className = `ydi-score ${scoreClass(response.total_error)}`;
  scoreEl.textContent = response.score_label || t('answered');

  const ctaLink = document.createElement("a");
  ctaLink.href = quizPageUrl(quiz.id);
  ctaLink.textContent = t('trySelf');

  const downloadBtn = document.createElement("button");
  downloadBtn.className = "dvz-btn-secondary";
  downloadBtn.textContent = t('saveImage');
  downloadBtn.addEventListener("click", () => downloadChartPng(getSvg(), quiz.title));

  const ctaDiv = document.createElement("div");
  ctaDiv.className = "dvz-cta";
  ctaDiv.append(ctaLink, downloadBtn);

  resultEl.append(scoreEl, ctaDiv);
}

// ---- 初期化 ----
async function init() {
  const contentEl = document.getElementById("dvz-content");
  const resultEl = document.getElementById("dvz-result");
  const responseId = new URLSearchParams(window.location.search).get("id");
  if (!responseId) {
    showPageError(t('noId'));
    return;
  }

  const cancelTimeout = startLoadTimeout(t('timeout'));
  try {
    const { data: response, error } = await quizSupabase
      .from("quiz_responses")
      .select("*, quiz_quizzes(*)")
      .eq("id", responseId)
      .single();
    cancelTimeout();

    if (error || !response || !response.quiz_quizzes) {
      showPageError(t('notFound'));
      return;
    }

    const quiz = response.quiz_quizzes;
    const cfg = { ...quiz.chart_config, id: responseId, title: quiz.chart_config?.title || quiz.title };

    document.title = quiz.title + " — " + t('resultSuffix');
    updateOgpMeta(responseId, `${quiz.title} — ${response.score_label || t('resultLabel')}`);

    hideLoading();
    contentEl.style.display = "block";
    resultEl.style.display = "block";

    const chart = new ChartInstance(contentEl, cfg, {
      mode: "static",
      breakpoints: "public",
      labels: {
        legendPrediction: t('legendPrediction'),
        legendActual: t('legendActual'),
      },
    });
    chart.renderPrediction(response.prediction_data);

    renderResult(resultEl, response, quiz, () => contentEl.querySelector("svg"));
  } catch (e) {
    cancelTimeout();
    showPageError(t('error'));
    console.error(e);
  }
}

init();
</script>
</body>
</html>
